name: indexgap check
description: >-
  Quality control for programmatic SEO in CI: near-duplicates, thin pages,
  template seams, orphans, hreflang and JavaScript shells in the built site.
  With a baseline, the build fails only on findings that are new.
author: borisowlexa2010-star
branding:
  icon: check-square
  color: green

inputs:
  root:
    description: Directory with the built pages. Empty means the one in indexgap.json.
    default: ""
  site:
    description: The full site address, e.g. https://example.com. Empty means the one in indexgap.json.
    default: ""
  baseline:
    description: >-
      JSON from an earlier `indexgap check` run, committed to the repository.
      Findings already in it are known debt; only new critical findings fail the build.
    default: ""
  strict:
    description: Fail the job on critical findings (only new ones when a baseline is given).
    default: "true"
  args:
    description: Any other arguments for `indexgap check`, e.g. "--sitemap out/sitemap.xml --profile catalog".
    default: ""
  python-version:
    description: Python to run on. Any version from 3.9 works.
    default: "3.12"

outputs:
  report:
    description: Path to the HTML report.
    value: ${{ steps.check.outputs.report }}
  data:
    description: Path to the JSON data, usable as the next baseline.
    value: ${{ steps.check.outputs.data }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    # The package is installed from the action's own checkout, so the
    # version is exactly the tag the workflow points at.
    - name: Install indexgap
      shell: bash
      run: python -m pip install --quiet --disable-pip-version-check "$GITHUB_ACTION_PATH"

    - name: Run indexgap check
      id: check
      shell: bash
      env:
        INDEXGAP_LANG: en
        IG_ROOT: ${{ inputs.root }}
        IG_SITE: ${{ inputs.site }}
        IG_BASELINE: ${{ inputs.baseline }}
        IG_STRICT: ${{ inputs.strict }}
        IG_ARGS: ${{ inputs.args }}
      run: |
        out="$RUNNER_TEMP/indexgap"
        mkdir -p "$out"
        cmd=(indexgap check)
        [ -n "$IG_ROOT" ] && cmd+=("$IG_ROOT")
        [ -n "$IG_SITE" ] && cmd+=(--site "$IG_SITE")
        [ -n "$IG_BASELINE" ] && cmd+=(--baseline "$IG_BASELINE")
        [ "$IG_STRICT" = "true" ] && cmd+=(--strict)
        # Extra arguments are split like a shell would, without running them.
        if [ -n "$IG_ARGS" ]; then
          eval "extra=($(printf '%s' "$IG_ARGS" | python -c 'import shlex,sys; print(" ".join(shlex.quote(a) for a in shlex.split(sys.stdin.read())))'))"
          cmd+=("${extra[@]}")
        fi
        cmd+=(--out "$out/indexgap-check.html")
        echo "report=$out/indexgap-check.html" >> "$GITHUB_OUTPUT"
        echo "data=$out/indexgap-check.json" >> "$GITHUB_OUTPUT"
        set +e
        "${cmd[@]}"
        code=$?
        set -e
        if [ -f "$out/indexgap-check.json" ]; then
          python -m indexgap.summary "$out/indexgap-check.json" >> "$GITHUB_STEP_SUMMARY" || true
        fi
        echo "code=$code" >> "$GITHUB_OUTPUT"

    - name: Keep the report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: indexgap-report
        path: ${{ runner.temp }}/indexgap/
        if-no-files-found: ignore

    - name: Result
      shell: bash
      run: exit "${{ steps.check.outputs.code || 1 }}"
