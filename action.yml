name: indexgap check
description: >-
  Quality control for programmatic SEO in CI: near-duplicates, thin pages,
  template seams, orphans, hreflang and JavaScript shells in the built site.
  With a baseline, the build fails only on findings that are new; with the
  previous build, also on what the deploy breaks.
author: borisowlexa2010-star
branding:
  icon: check-square
  color: green

inputs:
  root:
    description: Directory with the built pages. Empty means the one in indexgap.json.
    default: ""
  site:
    description: The full site address, e.g. https://example.com. Empty means the one in indexgap.json.
    default: ""
  baseline:
    description: >-
      JSON from an earlier `indexgap check` run, committed to the repository.
      Findings already in it are known debt; only new critical findings fail the build.
    default: ""
  strict:
    description: Fail the job on critical findings (only new ones when a baseline is given).
    default: "true"
  args:
    description: Any other arguments for `indexgap check`, e.g. "--sitemap out/sitemap.xml --profile catalog".
    default: ""
  old-root:
    description: >-
      Directory with the previous build (the one in production), e.g. built from
      the previous commit or downloaded from the last deploy. When set, `indexgap
      diff` compares it with `root` after the check: pages that disappear without a
      redirect, pages that close, template-wide changes, new critical findings.
      Needs `root`.
    default: ""
  diff-args:
    description: Any other arguments for `indexgap diff`, e.g. "--dataset keywords.csv --profile catalog".
    default: ""
  python-version:
    description: Python to run on. Any version from 3.9 works.
    default: "3.12"
  artifact:
    description: Name of the uploaded report artifact. Give each step its own when the action runs more than once in a job.
    default: indexgap-report

outputs:
  report:
    description: Path to the HTML report.
    value: ${{ steps.check.outputs.report }}
  data:
    description: Path to the JSON data, usable as the next baseline.
    value: ${{ steps.check.outputs.data }}
  diff-report:
    description: Path to the HTML report of `indexgap diff`; empty without old-root.
    value: ${{ steps.check.outputs.diff-report }}
  diff-data:
    description: Path to the JSON data of `indexgap diff`; empty without old-root.
    value: ${{ steps.check.outputs.diff-data }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    # The package is installed from the action's own checkout, so the
    # version is exactly the tag the workflow points at.
    - name: Install indexgap
      shell: bash
      run: python -m pip install --quiet --disable-pip-version-check "$GITHUB_ACTION_PATH"

    - name: Run indexgap check
      id: check
      shell: bash
      env:
        INDEXGAP_LANG: en
        # Сводка пишется в файл шага: на Windows без этого — cp1252 и падение
        # на первом кириллическом адресе.
        PYTHONUTF8: "1"
        IG_ROOT: ${{ inputs.root }}
        IG_SITE: ${{ inputs.site }}
        IG_BASELINE: ${{ inputs.baseline }}
        IG_STRICT: ${{ inputs.strict }}
        IG_ARGS: ${{ inputs.args }}
        IG_OLD_ROOT: ${{ inputs.old-root }}
        IG_DIFF_ARGS: ${{ inputs.diff-args }}
      run: |
        # Extra arguments are split like a shell would, without running them.
        # Незакрытая кавычка — ошибка, а не тихо потерянные аргументы.
        split_args() {
          extra=()
          [ -n "$2" ] || return 0
          if ! quoted="$(printf '%s' "$2" | python -c 'import shlex,sys; print(" ".join(shlex.quote(a) for a in shlex.split(sys.stdin.read())))')"; then
            echo "::error title=indexgap::cannot split $1 (unbalanced quote?): $2"
            exit 2
          fi
          eval "extra=($quoted)"
        }
        # Новая сборка не названа — берём каталог из indexgap.json, как check.
        if [ -n "$IG_OLD_ROOT" ] && [ -z "$IG_ROOT" ]; then
          IG_ROOT="$(python -c 'import json,sys
        try:
            r = json.load(open("indexgap.json", encoding="utf-8")).get("root") or ""
        except (OSError, ValueError):
            r = ""
        print(r if isinstance(r, str) else "")' 2>/dev/null || true)"
          if [ -z "$IG_ROOT" ]; then
            echo "::error title=indexgap::old-root needs root: name the directory of the new build or set root in indexgap.json"
            exit 2
          fi
        fi
        # Свой каталог на каждый запуск: второй вызов действия в той же job
        # не должен показывать отчёт первого, если сам упал на входе.
        out="$(mktemp -d "$RUNNER_TEMP/indexgap-XXXXXX")"
        echo "dir=$out" >> "$GITHUB_OUTPUT"
        cmd=(indexgap check)
        [ -n "$IG_ROOT" ] && cmd+=("$IG_ROOT")
        [ -n "$IG_SITE" ] && cmd+=(--site "$IG_SITE")
        [ -n "$IG_BASELINE" ] && cmd+=(--baseline "$IG_BASELINE")
        [ "$IG_STRICT" = "true" ] && cmd+=(--strict)
        split_args args "$IG_ARGS"
        cmd+=("${extra[@]}" --out "$out/indexgap-check.html")
        if [ -n "$IG_OLD_ROOT" ]; then
          dcmd=(indexgap diff "$IG_OLD_ROOT" "$IG_ROOT")
          [ -n "$IG_SITE" ] && dcmd+=(--site "$IG_SITE")
          [ "$IG_STRICT" = "true" ] && dcmd+=(--strict)
          split_args diff-args "$IG_DIFF_ARGS"
          dcmd+=("${extra[@]}" --out "$out/indexgap-diff.html")
        fi
        echo "report=$out/indexgap-check.html" >> "$GITHUB_OUTPUT"
        echo "data=$out/indexgap-check.json" >> "$GITHUB_OUTPUT"
        set +e
        "${cmd[@]}"
        code=$?
        set -e
        if [ -f "$out/indexgap-check.json" ]; then
          python -m indexgap.summary "$out/indexgap-check.json" >> "$GITHUB_STEP_SUMMARY" || true
        fi
        if [ -n "$IG_OLD_ROOT" ]; then
          echo "diff-report=$out/indexgap-diff.html" >> "$GITHUB_OUTPUT"
          echo "diff-data=$out/indexgap-diff.json" >> "$GITHUB_OUTPUT"
          set +e
          "${dcmd[@]}"
          diff_code=$?
          set -e
          if [ -f "$out/indexgap-diff.json" ]; then
            python -m indexgap.summary "$out/indexgap-diff.json" >> "$GITHUB_STEP_SUMMARY" || true
          fi
          # Шаг падает, если упал любой из двух строгих прогонов.
          if [ "$code" -eq 0 ]; then code=$diff_code; fi
        fi
        echo "code=$code" >> "$GITHUB_OUTPUT"

    - name: Keep the report
      # Без каталога путь стал бы «/» — загружать нечего, а не всё подряд.
      if: always() && steps.check.outputs.dir != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact }}
        path: ${{ steps.check.outputs.dir }}/
        if-no-files-found: ignore
        overwrite: true

    - name: Result
      shell: bash
      run: exit "${{ steps.check.outputs.code || 1 }}"
