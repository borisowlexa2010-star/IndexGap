# Публикация в PyPI по тегу вида v1.0.0.
#
# Ничего не произойдёт, пока в настройках репозитория не появится окружение
# `pypi` — так что рабочий процесс безопасно лежать здесь с первого дня.
# Настройка один раз: на pypi.org → Publishing → добавить Trusted Publisher
# для этого репозитория и workflow `publish.yml`. Токены хранить не нужно.

name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Тег не должен расходиться с версией в пакете: разошедшийся тег
      # публикует не то, что обещает, и откатить это на PyPI нельзя.
      - name: Tag must match the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import re,pathlib; \
            print(re.search(r'__version__ = \"([^\"]+)\"', \
            pathlib.Path('indexgap/__init__.py').read_text()).group(1))")
          echo "tag=$tag package=$pkg"
          [ "$tag" = "$pkg" ] || { echo "::error::tag $tag != version $pkg"; exit 1; }
      - name: Tests must pass before anything is published
        run: python -m unittest discover -s tests
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # Trusted Publishing — без хранимых токенов
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
