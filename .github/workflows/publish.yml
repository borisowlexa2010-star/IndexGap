# Публикация в PyPI по тегу вида v1.0.0.
#
# Ничего не произойдёт, пока в настройках репозитория не появится окружение
# `pypi` — так что рабочий процесс безопасно лежать здесь с первого дня.
# Настройка один раз: на pypi.org → Publishing → добавить Trusted Publisher
# для этого репозитория и workflow `publish.yml`. Токены хранить не нужно.

name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Ручной запуск с ветки ставит тег по версии из пакета и запускает этот же
  # workflow уже на теге. Так релиз не зависит от того, может ли пушить теги
  # тот, кто его делает: облачная сессия может пушить только ветку.
  # Тег, поставленный GITHUB_TOKEN, событие push не порождает — поэтому
  # второй запуск явный, через workflow_dispatch, который этому токену разрешён.
  tag:
    if: github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag the package version and publish from the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pkg=$(python3 -c "import re,pathlib; \
            print(re.search(r'__version__ = \"([^\"]+)\"', \
            pathlib.Path('indexgap/__init__.py').read_text()).group(1))")
          tag="v$pkg"
          grep -q "^## $pkg " CHANGELOG.md || { echo "::error::no CHANGELOG section for $pkg"; exit 1; }
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            [ "$(git rev-list -n1 "$tag")" = "$(git rev-parse HEAD)" ] || {
              echo "::error::$tag already points at another commit"; exit 1; }
            echo "$tag already on this commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "indexgap $pkg"
            git push origin "$tag"
          fi
          gh workflow run publish.yml --ref "$tag"
          echo "::notice::$tag tagged; publishing runs from the tag"

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Тег не должен расходиться с версией в пакете: разошедшийся тег
      # публикует не то, что обещает, и откатить это на PyPI нельзя.
      - name: Tag must match the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import re,pathlib; \
            print(re.search(r'__version__ = \"([^\"]+)\"', \
            pathlib.Path('indexgap/__init__.py').read_text()).group(1))")
          echo "tag=$tag package=$pkg"
          [ "$tag" = "$pkg" ] || { echo "::error::tag $tag != version $pkg"; exit 1; }
      - name: Tests must pass before anything is published
        run: python -m unittest discover -s tests
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
      # Собранное обязано нести номер из тега и ставиться: версия берётся из
      # пакета при сборке, и проверить это можно только на готовом колесе.
      - name: The wheel carries the tag's version and installs
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ls dist/
          ls dist/indexgap-"$tag"-py3-none-any.whl
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install --quiet dist/indexgap-"$tag"-py3-none-any.whl
          /tmp/wheel-check/bin/indexgap --version | grep -F "$tag"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # Trusted Publishing — без хранимых токенов
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # Релиз на GitHub с текстом из CHANGELOG и колесом во вложении. Раньше его
  # создавали руками после тега, и между тегом и релизом жила пустая
  # страница «Releases» — а Action по тегу уже был доступен.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Notes for this version from CHANGELOG.md
        run: |
          tag="${GITHUB_REF_NAME#v}"
          awk -v v="$tag" '
            /^## / { if (found) exit; if (index($0, "## " v " ") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::no CHANGELOG section for $tag"; exit 1; }
          cat notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && { echo "already exists"; exit 0; }
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --latest
