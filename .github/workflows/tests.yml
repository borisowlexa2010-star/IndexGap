name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor the package promises; 3.14 is the ceiling it must
        # not break on. 3.11 sits in the middle so a break has a bisect point.
        python-version: ["3.9", "3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the suite
        run: python -m unittest discover -s tests -v
      - name: Check the CLI starts and every command is reachable
        run: |
          python -m indexgap --help
          for cmd in init plan check brief sitemap notify portfolio profiles doctor cite; do
            python -m indexgap "$cmd" --help > /dev/null
          done

  # Сайт документации и обёртка плагина собираются из пакета, а лежат в
  # репозитории готовыми. Забыть пересобрать — значит опубликовать страницы,
  # которые описывают не тот код, что установится у человека. Проверяется тем
  # же способом, что и всё остальное здесь: собрать заново и сравнить.
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Rebuild everything that is generated
        run: |
          python tools/sync_plugin.py
          python tools/build_docs.py
      - name: It must match what is committed
        run: |
          if ! git diff --quiet; then
            echo "::error::Сгенерированное разошлось с кодом. Запусти локально:"
            echo "::error::  python3 tools/sync_plugin.py && python3 tools/build_docs.py"
            git diff --stat
            exit 1
          fi
          echo "docs/ и skills/ соответствуют коду"
