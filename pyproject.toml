[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "indexgap"
# Версия записана в одном месте — в пакете. Раньше её нужно было поднять и
# здесь, и там: забытая здесь, она проходила все проверки и давала колесо со
# старым номером.
dynamic = ["version"]
description = "Lint your programmatic SEO pipeline — from keywords to indexed pages. No dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["seo", "programmatic-seo", "sitemap", "indexnow", "aeo", "geo",
            "search-console", "site-audit", "lint"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP :: Site Management",
  "Topic :: Text Processing :: Markup :: HTML",
]

dependencies = []

[project.urls]
Homepage = "https://github.com/borisowlexa2010-star/IndexGap"
Changelog = "https://github.com/borisowlexa2010-star/IndexGap/blob/main/CHANGELOG.md"
Issues = "https://github.com/borisowlexa2010-star/IndexGap/issues"

[project.scripts]
indexgap = "indexgap.cli:main"

[tool.setuptools]
packages = ["indexgap", "indexgap.locale", "indexgap.locale.en"]

[tool.setuptools.dynamic]
version = { attr = "indexgap.__version__" }

[tool.setuptools.package-data]
indexgap = ["skills/*/SKILL.md", "skills/*/SKILL.*.md"]
